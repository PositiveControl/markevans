# Kamal 2 Deployment Configuration
#
# Shares a server with dopeempire (idlempire.com). The two apps sit
# behind the one kamal-proxy on that host, routed by `proxy.host`; each runs
# its own Postgres accessory, so this one takes host port 5433.
#
# Setup:
# 1. Fill in .kamal/secrets (see .kamal/secrets.example)
# 2. Point markevans.io's DNS A record at the server below
# 3. Run: kamal setup
#
# Deploy: kamal deploy
# Console: kamal console
# Logs: kamal logs

service: markevans

# Container image on GitHub Container Registry
image: positivecontrol/markevans

# Deploy to these servers
servers:
  web:
    hosts:
      - 95.217.152.24 # lint-docs:ignore
    options:
      memory: 2g

# Proxy configuration (Kamal 2 uses kamal-proxy)
proxy:
  ssl: true
  host: markevans.io
  app_port: 3000
  healthcheck:
    path: /up
    interval: 3
    timeout: 3

# GitHub Container Registry credentials
registry:
  server: ghcr.io
  username: positivecontrol
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables
env:
  secret:
    - RAILS_MASTER_KEY
    # Four databases in the one markevans-db container. Pointing all four
    # roles at one database breaks bin/docker-entrypoint: loading the Solid
    # schemas into the migrated primary trips ProtectedEnvironmentError.
    - DATABASE_URL
    - QUEUE_DATABASE_URL
    - CABLE_DATABASE_URL
    - CACHE_DATABASE_URL
  clear:
    RAILS_ENV: production
    RAILS_LOG_LEVEL: info
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 1
    RAILS_MAX_THREADS: 5

# Aliases for common commands
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Persistent storage for uploads
volumes:
  - "markevans_storage:/rails/storage"

# Bridge assets between deploys
asset_path: /rails/public/assets

# Docker build configuration
# Use remote builder to avoid ARM64→x86_64 emulation issues with Tailwind CSS
# See: https://github.com/rails/tailwindcss-rails/discussions/499
builder:
  arch: amd64
  remote: ssh://root@95.217.152.24 # lint-docs:ignore

# PostgreSQL database accessory
# The app reaches it as markevans-db:5432 on the kamal Docker network; the
# host binding is only for SSH tunnels, and 5432 there is dopeempire-db's.
accessories:
  db:
    image: postgres:16
    host: 95.217.152.24 # lint-docs:ignore
    port: "127.0.0.1:5433:5432"
    env:
      clear:
        POSTGRES_USER: markevans
        POSTGRES_DB: markevans_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
