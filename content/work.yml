projects:
  - key: rails-rocket-sheep
    name: rails-rocket-sheep
    summary: "A Rails 8 template for LLM-harnessed development."
    links:
      - label: Repository
        url: https://github.com/PositiveControl/rails-rocket-sheep
    sections:
      - heading: The project
        paragraphs:
          - "A Rails 8 application template for building with AI coding agents. rails new gives you a framework; this gives you a codebase an agent can be productive in on the first prompt: the patterns are already there, the conventions are written down one rule per file, a generated CLAUDE.md routes the agent to the right rule before it touches anything, and the rules a machine can check are checked at push time and in CI. The result is that the tenth feature looks like the first one."
          - "It was built because many side projects start from rails new. The template gets the boilerplate out of the way and gives each one the same foundation, ready to develop and deploy the same day. It is applied once and leaves behind ordinary Rails files: no gem, no runtime dependency, nothing to upgrade. MIT licensed. This site was generated from it."
        groups:
          - title: At a glance
            rows:
              - k: Role
                v: Creator and maintainer
              - k: Stack
                v: Rails 8
              - k: Status
                v: Released and maintained
      - heading: How it was built
        paragraphs:
          - "The workflow started at work. From March 2026, uCollect's team repo carried a set of agent slash commands for planning, submitting and reviewing pull requests, with teammates adding to them; in July they were reshaped into the chain on /workflow: /pick, /feature_plan, /task_plan and /implement. The template itself was carved out of an existing Rails app in January 2026: the stack, the service and registry patterns, and a CLAUDE.md. From August the workflow, conventions and gates were extracted into it, tested against the apps the template generates, and adopted back into the project repos: DailyDrop and uCollect in August, IDLEmpire in October. When it was mature enough, the template began running its own workflow on itself: since October 2026 its features go through it, with a design doc, slices on a feature branch, and gates in CI. What came of it: four releases, and the codebase this site was generated from."

  - key: idlempire
    name: IDLEmpire
    summary: "A multiplayer browser strategy game."
    links:
      - label: Site
        url: https://idlempire.com
    sections:
      - heading: The project
        paragraphs:
          - "Adversarial multiplayer systems: a combat engine and simulator, a balanced production economy with a fair-allocation model, alliance treasuries, diplomacy negotiation with escrow, bounties, and era transitions."
          - "Autonomous bot agents, built as decision and action services, take part in the live economy. Real-time chat and a comm panel run over ActionCable."
          - "Deployed with Kamal and Docker, with a written architecture review and an ActionCable performance analysis. Test code exceeds application code."
        groups:
          - title: At a glance
            rows:
              - k: Role
                v: Creator and maintainer
              - k: Stack
                v: Rails 8, ActionCable, Godot, Kamal, Docker
              - k: Status
                v: Live at idlempire.com
      - heading: How it was built
        paragraphs:
          - "Built fast from a scaffold in December 2025: a tick engine, the economy loop, combat and a leaderboard in its first days. In October 2026 it adopted the rails-rocket-sheep workflow, and since then work lands through the chain: each change an issue, planned and built as its own slice and pull request, across the Rails server and a Godot client."

  - key: harness
    name: harness
    summary: "A local-first agent harness that makes a local quantized 30B model reliable enough to run unattended."
    links:
      - label: Repository
        url: https://github.com/PositiveControl/harness
    sections:
      - heading: The project
        paragraphs:
          - "An autonomous execution loop drives a planned workplan toward closure: a spec-to-plan compiler behind an operator approval gate, an executor working one issue per turn, and a turn state machine (ASSESS, WRITE_TEST, IMPLEMENT, VERIFY, CLOSE, with halt reachable from any phase). A critic loop requires consecutive clean passes before declaring convergence, because a single clean pass can be a transient model artifact."
          - "Observed failures become deterministic guards rather than prompt tweaks: premise checks before test-writing, synthesis of structurally-always-red gates, plan linting against over-scoped work, and a pre-commit interceptor that blocks a false success acknowledgement before the model can see it."
          - "A cite-grounded verification tool over 2,437 chunks of FAA air-traffic-control phraseology regulation holds a two-gate cite-or-silent policy: empty retrieval short-circuits without invoking the model, and a citation absent from the retrieved anchors is refused rather than returned. It is scored against a hand-labeled fixture that includes real recorded audio."
          - "Eleven eval suites cover retrieval quality, tool-selection accuracy, tool-loop behavior and session resumption. Model selection is fixture-driven: a router bake-off scoring four candidate models from 1.00 down to 0.40 settled which one shipped."
          - "Memory is append-only episodic and semantic stores over SQLite with embeddings, with a three-tier seed, working, consolidated write path and rows that support non-destructive re-embedding when models are swapped. 4,231 tests run against real SQLite stores, with no mocks, and mypy --strict covers 399 source files; both are gated in pre-commit and pre-push."
        groups:
          - title: At a glance
            rows:
              - k: Role
                v: Creator and maintainer
              - k: Stack
                v: Python, MLX on Apple Silicon, SQLite
              - k: Status
                v: In development
      - heading: How it was built
        paragraphs:
          - "[How it moved through the delivery chain, and what came of it]"

  - key: kram
    name: kraM
    summary: "A reversible programming language and gate compiler, written in Go."
    links:
      - label: Repository
        url: https://github.com/PositiveControl/kraM
    sections:
      - heading: The project
        paragraphs:
          - "A language whose programs run backward exactly, and a compiler backend that lowers them to elementary X, CNOT and Toffoli circuits. An equivalence checker verifies each compiled circuit against the interpreter across every basis state."
          - "The circuits compile to OpenQASM and were run on IBM Quantum hardware, with measured fidelity recorded against the noise floor, including the runs that degraded."
        groups:
          - title: At a glance
            rows:
              - k: Role
                v: Creator
              - k: Stack
                v: Go, OpenQASM, IBM Quantum
              - k: Status
                v: "[Status]"
      - heading: How it was built
        paragraphs:
          - "[How it moved through the delivery chain, and what came of it]"

  - key: dailydrop
    name: DailyDrop
    summary: "A music curation platform, Rails 8 and native iOS: songs are never hosted, but exported into the listener's own streaming account."
    links:
      - label: Site
        url: https://dailydrop.fm
    sections:
      - heading: The project
        paragraphs:
          - "Multi-user daily music curation with taste-matching and subscriber communities. One click exports a drop into the listener's own streaming account."
          - "Passkeys and WebAuthn authentication with a password fallback, and Apple Music (MusicKit) and Spotify OAuth and playlist integration, including the platforms' compliance work. A native Swift iOS client carries a Live Activities widget extension and its own test suite."
          - "A feature-flag and experiment framework, Architecture Decision Records, and a deployment and incident runbook. Deployed with Kamal 2 and Docker; GitHub Actions CI runs a Lighthouse performance budget. Test code exceeds application code."
        groups:
          - title: At a glance
            rows:
              - k: Role
                v: Creator and maintainer
              - k: Stack
                v: Rails 8, Solid Queue, Cache and Cable, Swift, Kamal 2
              - k: Status
                v: Live at dailydrop.fm
      - heading: How it was built
        paragraphs:
